name: cli

on:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: cli
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: format
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build
        run: go build ./...
      - name: installer
        working-directory: ${{ github.workspace }}
        run: sh scripts/install-test.sh
      - name: e2e
        working-directory: ${{ github.workspace }}
        run: sh scripts/e2e-test.sh
